name: Keep Supabase awake

# Supabase pauses free projects after 7 days with no database activity, and a
# paused project means a dead app on a Saturday morning. One trivial query a week
# is enough to prevent it.
#
# Needs VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository variables
# (Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    # 09:00 UTC every Monday. Well inside the 7-day window even if a run is
    # skipped — GitHub drops scheduled runs on repos with no recent activity,
    # so the margin matters.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase variables not configured — nothing to keep awake."
            exit 0
          fi

          # Hits PostgREST with an anonymous request. Row-level security means
          # this returns zero rows, which is the point: it proves the database
          # woke up without needing any privileges.
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
            "$URL/rest/v1/clubs?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          echo "HTTP $code"
          cat /tmp/out.txt

          # 200 with an empty array is the expected result. 401/403 also prove
          # the database is awake and answering, so they are not failures here.
          case "$code" in
            200|401|403) echo "Project is awake."; exit 0 ;;
            *) echo "::error::Unexpected response — the project may be paused."; exit 1 ;;
          esac
