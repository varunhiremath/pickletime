<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PickleTime</title>
    <script>
      // GitHub Pages serves 404.html for any path it doesn't have a file for.
      // PickleTime is a single-page app, so a deep link like /pickletime/standings
      // lands here — bounce it back to the app root with the intended path in the
      // query string, which main.jsx restores into history before React mounts.
      (function () {
        var base = '/pickletime/';
        var path = window.location.pathname.slice(base.length);
        var target = base + '?redirect=' + encodeURIComponent(path + window.location.search + window.location.hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
